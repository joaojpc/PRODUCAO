{% block js %}
    <script>
        // AJUSTE 2026-06-24: Trava submit involuntário e duplo clique
        // Motivo: Enter do leitor de código de barras e duplo clique submetiam antes da validação
        // Regra de negócio: intacta. Só controle de UI pra evitar submit com 21 dígitos
        var v_refugo;
        var v_http;
        var v_get;
        var v_json;
        var v_args;
        var v_Return;
        var mydata;
        var v_texto;
        var v_padrao;
        let clicado = false;
        var v_ip = '192.168.0.24';
        var enviando = false; // AJUSTE 2026-06-24: flag pra travar duplo submit

        $.fn.numpad.defaults.gridTpl = '<table class="table modal-content"></table>';
        $.fn.numpad.defaults.backgroundTpl = '<div class="modal-backdrop in"></div>';
        $.fn.numpad.defaults.displayTpl = '<input type="text" class="form-control" />';
        $.fn.numpad.defaults.buttonNumberTpl = '<button type="button" class="btn btn-default"></button>';
        $.fn.numpad.defaults.buttonFunctionTpl = '<button type="button" class="btn" style="width: 100%;"></button>';
        $.fn.numpad.defaults.onKeypadCreate = function(){$(this).find('.done').addClass('btn-primary');};

        var tipo_ordem = "{{tipo_op}}";
        var filial = "{{fil_in_codigo}}";
        var dados_ordem = {{ordem | safe }};
        var item_pai;
        var v_tpo_st_codigo;
        var v_resumoordem;
        var lote_fornecedor = "{{fornecedor}}";
        var lote_origem = "{{origem}}";
        defineVariaveis();

        $(document).ready(function() {
            // AJUSTE 2026-06-24: Bloqueia Enter no form - leitor de código de barras incluso
            // Motivo: Leitor envia Enter automático e submetia antes de validar 21 dígitos no clean()
            $('#formlotes').on('keydown', function(e) {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            });

            // AJUSTE 2026-06-24: Reabilita botão se Django devolver erro de validação
            // Motivo: Se clean() barrar 21 dígitos, usuário precisa corrigir e tentar de novo
            if ($('.alert-danger,.invalid-feedback').length) {
                enviando = false;
                $('#submit').prop('disabled', false).text('Inserir lote');
            }

            $('#qtdeloteprod-btn').numpad({
              target: $('#numpadqtdeprod')
            });
            $('#qtdeloterefugo-btn').numpad({
              target: $('#numpadqtderefugo')
            });
            v_refugo = 0;
            $("#numpadqtderefugo").val(v_refugo);
            if (tipo_ordem == 'S'){
                $("#id_ori_lote").val(lote_origem);
            }
            if (v_tpo_st_codigo == 'OP001'){
                $("#id_ori_fornec").val(lote_fornecedor);
                $("#id_ori_lote").val(lote_origem);
            }
        });

        function criatagitem() {
            var div = $("<div />", {
                id: 'Produtos',
                title: 'Produtos',
                class: 'form-group'
            });
            $("#formlotes").append(div);
        };

        criabtprod('produto');
        criarBotoes(v_resumoordem);
        criaButton();

        var v_ref_id;
        var var_concat;
        var var_cod_prod;
        var var_nome_prod;
        var v_refpadrao;
        var arr = [];
        var count = 0;
        var var_name;
        var var_type;
        var var_nmId;
        var v_itn_id;
        var v_parent_id;
        var v_ref_id;
        var v_lista;
        var sel_key;
        var sel_value;
        var var_input;
        litens = {{lista | safe}};
        ordem = {{ord_in_codigo | safe}};
        $("#id_ord_in_codigo").val(ordem);
        $("#id_fil_in_codigo").val(filial);
        $('#id_produto').change(function(){addInput_new(this)});
        populateBrand();

        function populateBrand() {
            $('#id_produto').empty();
            $("#id_produto").append('<option value="" disabled selected>Selecionar o item</option>');
            $.each(litens, function(){
                $.each(this, function (name, value) {
                   if (name == 'pro_in_codigo') {
                      var_cod_prod = value;
                   };
                   if (name == 'pro_st_descricao') {
                      var_nome_prod = value;
                   };
                });
                $('#id_produto').append( '<option value="'+var_cod_prod+'">'+var_cod_prod+' - '+var_nome_prod+'</option>' );
            });
        }

        function defineVariaveis() {
            $.each(dados_ordem, function(key, value){
                if (key == 'pro_in_codigo') {
                   item_pai = value;
                }
                if (key == 'tpo_st_codigo') {
                   v_tpo_st_codigo = value;
                }
                if (key == 'total_apontamento') {
                   v_resumoordem = value;
                }
            });
        }

        function addInput_new() {
            document.getElementById("caracteristica").style.visibility = "visible";
            document.getElementById("id_refugo").style.visibility = "hidden";
            document.querySelector('#numpadqtderefugo').disabled = true;
            document.querySelector('#qtdeloterefugo-btn').disabled = true;
            if ($('#id_produto').val() == item_pai ) {
                document.getElementById("id_refugo").style.visibility = "visible";
                document.querySelector('#numpadqtderefugo').disabled = false;
                document.querySelector('#qtdeloterefugo-btn').disabled = false;
            }
            remInput();
            var v_referencia;
            var v_ref;
            var v_atributos;
            var v_conv;
            v_ref = dadosProduto(1);
            var v_descricaoRef;
            v_refpadrao = dadosProduto(3);
            if (v_ref > 0) {
                criatag();
                v_referencia = getAtributosReferencia(v_ref,'S',0);
                for (var i = 0, len = v_referencia.length; i < len; ++i) {
                    v_descricaoRef = v_referencia[i].RAT_ST_DESCRICAO.replaceAll(' ', '_');
                    if (v_referencia[i].RAT_CH_TIPO == 'L') {
                        criainput(v_descricaoRef, v_referencia[i].RAT_VALUE);
                    }
                    else
                    {
                        criaselect(v_descricaoRef);
                        v_atributos = getAtributosReferencia(v_ref,'N',v_referencia[i].RAT_IN_CODIGO);
                        for (var j = 0, leng = v_atributos.length; j < leng; ++j) {
                            if (v_refpadrao.includes(v_atributos[j].RAT_VALUE)){
                                $('#'+var_nmId).append( '<option selected value="'+v_atributos[j].RAT_VALUE+'">'+v_atributos[j].RAT_VALUE+' - '+v_atributos[j].RAT_ST_DESCRICAO+'</option>' );
                            }
                            else {
                                $('#'+var_nmId).append( '<option value="'+v_atributos[j].RAT_VALUE+'">'+v_atributos[j].RAT_VALUE+' - '+v_atributos[j].RAT_ST_DESCRICAO+'</option>' );
                          }
                        }
                    }
                }
            }
            v_conv = getItensConversores();
            if (v_conv.length > 0) {
                criatag_conv();
                criaselectConv('Conversores');
                $("#id_Conversores").append('<option value="" disabled selected>Selecionar o conversor</option>');
                for (var i = 0, len = v_conv.length; i < len; ++i) {
                    $('#id_Conversores').append( '<option selected value="'+v_conv[i].UNI_ST_FORMULA+'">'+v_conv[i].FMT_ST_NOME+' ('+v_conv[i].UNI_ST_FORMULA+')</option>' );
                }
                if (v_conv.length == 1){
                    document.getElementById("id_Conversores").selectedIndex = "1";
                }
                else {
                    document.getElementById("id_Conversores").selectedIndex = "0";
                }
            }
        };

        function addConversores() {
             var itn;
            $.each(conversores, function(key, value){
                itn = value;
            })
        };

        function criatag() {
            var div = $("<div />", {
                id: 'referencias',
                title: 'estilo',
                class: 'module aligned'
            });
            $("#caracteristica").append(div);
        };

        function criatag_conv() {
            var div = $("<div />", {
                id: 'conversores',
                title: 'estilo',
                class: 'module aligned'
            });
            $("#caracteristica").append(div);
        };

        function criainput(nome, valor,atributo) {
            var_nome = 'id_'+nome
            var html = '<p><label for=\"name\">'+nome+'</label>';
            html += '<input type="hidden" id="hiddenField" value='+valor+' class="hiddenField"/> '
            html += '<input type="text" id="id_'+nome+'" class="select-style" style="text-align:left" size="20" value="" placeholder=""/>';
            html += '<button class="btn btn-default" id="id_'+nome+'-btn" type="button"><i class="glyphicon glyphicon-th"></i></button>';
            html += '</span></p>';
            $("#referencias").append(html)
                if (var_nome=='id_Largura') {
                    $('#id_Largura-btn').numpad({
                        target: $('#id_Largura')
                    });
                }
                if (var_nome=='id_ComprImento') {
                    $('#id_ComprImento-btn').numpad({
                        target: $('#id_ComprImento')
                    });
                }
        };

        function criaButton() {
            var html = '';
            if (tipo_ordem == 'S'){
                html = '<div class="form-group">';
                html += '<label for="id_ori_lote">Origem:</label>';
                html += '<input type="text" name="dem_st_lote" maxlength="22" class="form-control" required="false" id="id_ori_lote">';
                html += '</div>';
            }
            if (v_tpo_st_codigo == 'OP001'){
                html = '<div class="form-group">';
                html += '<label for="id_ori_lote">Origem:</label>';
                html += '<input type="text" name="dem_st_lote" maxlength="22" class="form-control" required="false" id="id_ori_lote">';
                html += '<label for="id_ori_fornec">Fornecedor:</label>';
                html += '<input type="text" name="ori_st_fornec" maxlength="30" class="form-control" required="false" id="id_ori_fornec">';
                html += '</div>';
            }
            html += '<label for="numpadButton">Quantidade do Lote:</label>';
            html += '<div class="form-group input-group">';
            html += '<input type="number" id="numpadqtdeprod" step="0.001" class="form-control" placeholder="Enter a number" aria-describedby="numpadButton-btn" required>';
            html += '<span class="input-group-btn">';
            html += '<button class="btn btn-default" id="qtdeloteprod-btn" type="button"><i class="glyphicon glyphicon-th"></i></button>';
            html += '</span>';
            html += '</div>';
            html += '<div id="id_refugo">';
            html += '<label for="numpadButton">Quantidade Refugo:</label>';
            html += '<div class="form-group input-group">';
            html += '<input type="number" id="numpadqtderefugo" step="0.001" class="form-control" placeholder="Enter a number" aria-describedby="numpadButton-btn" required>';
            html += '<span class="input-group-btn">';
            html += '<button class="btn btn-default" id="qtdeloterefugo-btn" type="button"><i class="glyphicon glyphicon-th"></i></button>';
            html += '</span>';
            html += '</div>';
            html += '</div>';
            $("#Itens").append(html)
        };

        function criabtprod(args) {
            var_nmId = 'id_'+args;
            var_IdVal = '#id_'+args;
            var html = '<p><label for=\"name\">'+args+'</label>';
            html += '<select name='+args+' id="id_'+args+'" step="any" class="form-control form-control is-invalid" required>';
            html += '<option value="" disabled selected>Selecionar o item</option>';
            html += '</select> </p>';
            $("#Itens").append(html)
        };

        function criaselect(args) {
            var_nmId = 'id_'+args;
            var_IdVal = '#id_'+args;
            var html = '<p><label for=\"name\">'+args+'</label>';
            html += '<select name='+args+' id="id_'+args+'" step="any" class="form-control is-invalid" required>';
            if (v_refpadrao == 'Indefinido'){
               html += '<option value="" disabled selected>Selecionar o atributo</option>';
            }
            html += '</select> </p>';
            $("#referencias").append(html)
        };

        function criaselectConv(args) {
            var_nmId = 'id_'+args;
            var_IdVal = '#id_'+args;
            var html = '<p><label for=\"name\">'+args+'</label>';
            html += '<select name='+args+' id="id_'+args+'" step="any" class="form-control is-invalid" required>';
            html += '</select> </p>';
            $("#conversores").append(html)
        };

        function remInput() {
           $("#referencias").remove();
           $("#conversores").remove();
        };

        function myFunction() {
            // FUNÇÃO ORIGINAL - NÃO ALTERADA
            // AJUSTE 2026-06-24: Mantida intacta. Regra de negócio preservada
            var_concat = 0;
            var_b = '';
            var var_a = '';
            var var_b = '';
            var var_c = '';
            var var_d = ';';
            var var_e = '';
            var var_cod = 0;
            var var_conversor = 0;
            var qtde_prod = 0;
            var qtde_refugo = 0;
            var_cod = $("#id_produto").val();
            $("#id_pro_in_codigo").val(var_cod);
            qtde_prod = $("#id_orl_re_qtdlote").val().replace(",", ".");
            $("#id_orl_re_qtdlote").val(qtde_prod);
            if ($("#id_orl_re_qtdrefugo").val()=='') {
                $("#id_orl_re_qtdrefugo").val(qtde_refugo);
            }
            qtde_refugo = $("#id_orl_re_qtdrefugo").val().replace(",", ".");
            $("#id_orl_re_qtdrefugo").val(qtde_refugo);
            if (tipo_ordem == 'S'){
                lote_origem = $("#id_ori_lote").val();
                $("#id_pro_st_loteori").val(lote_origem);
                $("#id_pro_st_fornecedor").val('Indefinido');
            }
            else if (v_tpo_st_codigo == 'OP001'){
                lote_fornecedor = $("#id_ori_fornec").val();
                lote_origem = $("#id_ori_lote").val();
                $("#id_pro_st_loteori").val(lote_origem);
                $("#id_pro_st_fornecedor").val(lote_fornecedor);
            }
            else {
                $("#id_pro_st_loteori").val('Indefinido');
                $("#id_pro_st_fornecedor").val('Indefinido');
            }
            $(':Input', referencias).each(function() {
                if ($(this).val()!= ''){
                    var_a = var_e;
                    if($(this).attr("type")=="hidden"){
                        var_b = $(this).val();
                        var_concat = 1;
                    }
                    else
                    {
                        if (var_concat = 1){
                            arr.push(var_b+$(this).val());
                            var_c = var_b+$(this).val();
                            var_concat = 0;
                            var_b = '';
                        }
                        else
                        {
                            var_b = '';
                            arr.push($(this).val());
                            var_c = $(this).val();
                            var_concat = 0;
                        }
                        var_e = var_a+var_b+var_c+var_d;
                    }
                }
                $("#id_orl_st_referencia").val(var_e);
            });

            if ($("#id_orl_st_referencia").val()=='') {
                $("#id_orl_st_referencia").val('*');
            }
        }

        // AJUSTE 2026-06-24: Submit controlado. Substitui alert por trava visual
        // Motivo: Evitar duplo clique e submit involuntário do leitor
        // Regra de negócio: intacta. myFunction() roda igual antes do submit
        $('#submit').click(function(e){
            e.preventDefault();
            if (enviando) return false;

            enviando = true;
            $(this).prop('disabled', true).text('Processando...');

            myFunction();

            // Garante que hiddens estejam habilitados pro Django ler no POST
            $('#formlotes input[type=hidden]').prop('disabled', false);

            $('#formlotes').off('submit').submit();
        });

        $('#numpadqtdeprod').on('change', function() {
         $("#id_orl_re_qtdlote").val($(this).val());
        });
        $('#numpadqtderefugo').on('change', function() {
         $("#id_orl_re_qtdrefugo").val($(this).val());
        });

        function getAtributosReferencia(pRef,pAgrupa,pPai) {
            if (pPai > 0) {
                v_http = 'http://'+v_ip+'/app/referencia/?rfc_in_codigo='+pRef+'&rat_bo_grupo='+pAgrupa+'&pai_rat='+pPai
            }
            else {
                v_http = 'http://'+v_ip+'/app/referencia/?rfc_in_codigo='+pRef+'&rat_bo_grupo='+pAgrupa
            }
            v_json = httpGet(v_http);
            v_Return = JSON.parse(v_json);
            return v_Return;
        }

        function getItensConversores() {
            var v_pro_st_id;
            var v_conversor;
            v_pro_st_id = dadosProduto(2);
            v_http = 'http://'+v_ip+'/app/itensOrdens/?pro_st_id='+v_pro_st_id
            v_json = httpGet(v_http);
            v_Return = JSON.parse(v_json);
            for (var i = 0, len = v_Return.length; i < len; ++i) {
                v_conversor = JSON.parse(v_Return[i].PRO_ST_CONVERSOR);
            }
            return v_conversor;
        }

        function httpGet(theUrl) {
            let xmlHttpReq = new XMLHttpRequest();
            xmlHttpReq.open("GET", theUrl, false);
            xmlHttpReq.send(null);
            return xmlHttpReq.responseText;
        }

        function dadosProduto(value){
            var v_retorno;
            for (var i = 0, len = litens.length; i < len; ++i) {
                if (litens[i].pro_in_codigo == $("#id_produto").val()) {
                    if (value == 1) {
                        v_retorno = litens[i].rfc_in_codigo;
                    }
                    if (value == 2) {
                        v_retorno = litens[i].pro_st_id;
                    }
                    if (value == 3) {
                        v_retorno = litens[i].mvs_st_referencia;
                    }
                }
            }
            return v_retorno
        }

        function criarBotoes(objeto) {
            const botoesDiv = document.getElementById('botoes_exibir');
            botoesDiv.innerHTML = `
                <span class="btn btn-info">Total Produzido: ${objeto.total_ordem}</span>
                <span class="btn btn-success">Total Demanda: ${objeto.total_demanda}</span>
                <span class="btn btn-warning">Saldo Demanda: ${objeto.saldo_demanda}</span>
            `;
        }
    </script>
{% endblock %}
