{% block js %}
<script>
    $.fn.numpad.defaults.gridTpl = '<table class="table modal-content"></table>';
	$.fn.numpad.defaults.backgroundTpl = '<div class="modal-backdrop in"></div>';
	$.fn.numpad.defaults.displayTpl = '<input type="text" class="form-control" />';
	$.fn.numpad.defaults.buttonNumberTpl =  '<button type="button" class="btn btn-default"></button>';
	$.fn.numpad.defaults.buttonFunctionTpl = '<button type="button" class="btn" style="width: 100%;"></button>';
	$.fn.numpad.defaults.onKeypadCreate = function(){$(this).find('.done').addClass('btn-primary');};
	litens = {{lista | safe}};
	populateBrand();
    function populateBrand() {
        $('#id_ati_in_codigo').empty();
        $("#id_ati_in_codigo").append('<option value="" disabled selected>Selecionar um motivo</option>');
        $.each(litens, function(){
            $.each(this, function (name, value) {
                if (name == 'ati_in_codigo') {
                    var_cod_prod = value;
                };
                if (name == 'ati_st_nome') {
                    var_nome_prod = value;
                 };
            });
                $('#id_ati_in_codigo').append( '<option value="'+var_cod_prod+'">'+var_cod_prod+' - '+var_nome_prod+'</option>' );
        });
    }
    criaButton();
    function criaButton() {
    var html  = '<label for="numpadButton">Tempo parado:</label>';
    html += '<div class="form-group input-group">';
    html += '<input type="text" id="ati_in_tempo" class="form-control" placeholder="Enter a number" aria-describedby="numpadButton-btn">';
    html += '<span class="input-group-btn">';
    html += '<button class="btn btn-default" id="ati_in_tempo-btn" type="button"><i class="glyphicon glyphicon-th"></i></button>';
    html += '</span>';
    html += '</div>';
    html += '<label for="numpadButton">Timer:';
    html += '<p id="demo"></p></label>';
    html += '</div>';
    $(".btn-group").append(html);
	};
	window.setInterval((function(){
        var start = Date.now();
        var textNode = document.createTextNode('0');
        document.getElementById('demo').appendChild(textNode);
        return function() {
            textNode.data = Math.floor((Date.now()-start)/1000);
        v_lote  = document.getElementById("demo").innerHTML;
        $("#id_ati_in_tempo").val(v_lote);
        $("#ati_in_tempo").val(v_lote);
        };
    }()), 1000);
    $(document).ready(function() {
        $('#ati_in_tempo-btn').numpad({
	        target: $('#ati_in_tempo')
        });
    });
    $('#ati_in_tempo').on('change', function() {
        $("#id_ati_in_tempo").val($(this).val());
    });
    litens = {{lista | safe}};
 </script>
{% endblock %}
