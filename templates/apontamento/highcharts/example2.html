{% load staticfiles %}
<html>
<head>
<script src="{% static 'bootstrap/js/jquery.min.js'%}"></script>
<script src="{% static 'highcharts/Highcharts-6.0.3/code/highcharts.js'%}"></script>
</head>
<body>
<div id="chart_container" style="width:100%; height:400px;"></div>
</body>
<!--javascript for charts
-->
<script>
$(function () {
$('#chart_container').highcharts({
chart: {
type: 'bar'
},
title: {
text: 'Monthly Sales'
},
xAxis: {
categories: ['Jan', 'Feb', 'Mar','Apr']
},
yAxis: {
title: {
text: 'numbers'
}
},
series: [{
name: 'John',
data: [1, 0, 4]
}, {
name: 'King',
data: [5, 7, 3]
}]
});
});
</script>
</body>
</html>
