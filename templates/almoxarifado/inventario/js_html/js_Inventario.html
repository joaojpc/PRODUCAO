<script>
      $(document).ready(function() {
          criaButton();
          //atribui_valor();
          function atribui_valor(){
              value_default = 100
              $("#id_pro_re_quantidade").val(value_default);
          };
          function criaButton() {
            var html  = '<span class="input-group-btn">';
            html += '<button class="btn btn-default nmpd-target" id="id_pro_re_quantidade" type="button" readonly="readonly" data-numpad="nmpd3"><i class="glyphicon glyphicon-th"></i></button>'
            html += '</span>';
            $("#id_pro_re_quantidade").append(html)
	      };

          $.fn.numpad.defaults.gridTpl = '<table class="table modal-content"></table>';
		  $.fn.numpad.defaults.backgroundTpl = '<div class="modal-backdrop in"></div>';
		  $.fn.numpad.defaults.displayTpl = '<input type="text" class="form-control" />';
		  $.fn.numpad.defaults.buttonNumberTpl =  '<button type="button" class="btn btn-default"></button>';
		  $.fn.numpad.defaults.buttonFunctionTpl = '<button type="button" class="btn" style="width: 100%;"></button>';
		  $.fn.numpad.defaults.onKeypadCreate = function(){$(this).find('.done').addClass('btn-primary');};

		  $.fn.numKey.defaults.gridTpl = '<table class="table modal-content"></table>';
		  $.fn.numKey.defaults.backgroundTpl = '<div class="modal-backdrop in"></div>';
		  $.fn.numKey.defaults.displayTpl = '<input type="text" class="form-control" />';
		  $.fn.numKey.defaults.buttonNumberTpl =  '<button type="button" class="btn btn-default"></button>';
		  $.fn.numKey.defaults.buttonFunctionTpl = '<button type="button" class="btn" style="width: 100%;"></button>';
		  $.fn.numKey.defaults.onKeypadCreate = function(){$(this).find('.done').addClass('btn-primary');};

		  $('#numpadButton-btn').numpad({
		      target: $('#numpadButton')
		  });
		  $('#search-btn').numKey({
		      target: $('#search')
		  });

          //$('#id_INV_RE_QUANTIDADE').numpad();
           $('input').keypress(function (e) {
                var code = null;
                code = (e.keyCode ? e.keyCode : e.which);
                return (code == 13) ? false : true;
            });
      });

      $('#numpadButton').on('change', function() {
         $("#id_inv_re_quantidade").val($(this).val());
      });


      //$("#baixarequisicao").on("submit", function(){
          //alert("form has been submitted.");
      //});
 </script>
