<VirtualHost *:80>	
    Alias /static /home/pi/dev/producao/producao/apontamento/static    

    WSGIDaemonProcess producao python-home=/home/pi/dev/producao/prod_env python-path=/home/pi/dev/producao/producao
    WSGIProcessGroup producao
    WSGIScriptAlias /producao /home/pi/dev/producao/producao/producao/wsgi.py	process-group=producao 

    <Directory home/pi/dev/producao/producao/static> 
        Require all granted
    </Directory>
 
    <Directory home/pi/dev/producao/producao/producao>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>    
    
        
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
