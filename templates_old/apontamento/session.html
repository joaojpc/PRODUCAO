{% extends 'apontamento/base.html' %}
{% block content %}
{% load widget_tweaks %}

	{% if username is None %}
	<form role="form" method="post">
		{% csrf_token %}
		{{ form.as_p }}
		<button type="submit" value="Submit" class="btn btn-info">LogIn</button>
	</form>
	{% else %}
		<h3>Welcome you are signed in as {{ usuario }}</h3>
		<h3>Order as {{ ordem }}</h3>
		<a href="{% url "demos_sessions" %}?action=logout">LogOut</a>
	{% endif %}

{% endblock  %}
